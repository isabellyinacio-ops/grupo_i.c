
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova senha | IC Agrícola</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                linear-gradient(rgba(0, 40, 10, 0.35), rgba(4, 62, 8, 0.3)),
                url("/static/TELAINICIO.png") no-repeat center;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 420px;
            max-width: 100%;
            padding: 45px 35px;
            background: rgba(255, 255, 255, 0.90);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
            text-align: center;
        }

        .card h2 {
            color: #0d4d2c;
            margin-bottom: 15px;
        }

        .card p {
            color: #555;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .input-box {
            margin-bottom: 18px;
        }

        .input-box input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
        }

        .input-box input:focus {
            border-color: #0d4d2c;
        }

        .btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 20px;
            background: #0d4d2c;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #146c43;
        }

        .voltar {
            display: block;
            margin-top: 22px;
            color: #0d4d2c;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .voltar:hover {
            text-decoration: underline;
        }

        .mensagem-error,
        .mensagem-success {
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 13px;
        }

        .mensagem-error {
            background: #ffe5e5;
            color: #a00000;
        }

        .mensagem-success {
            background: #e5f5e9;
            color: #0d4d2c;
        }
    </style>

</head>

<body>

    <div class="card">

        <h2>Crie uma nova senha</h2>

        <p>
            Digite sua nova senha e confirme
            para recuperar o acesso à sua conta.
        </p>

        {% with mensagens = get_flashed_messages(with_categories=true) %}
            {% if mensagens %}
                {% for categoria, mensagem in mensagens %}
                    <div class="mensagem-{{ categoria }}">
                        {{ mensagem }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">

            <div class="input-box">

                <input
                    type="password"
                    name="senha"
                    placeholder="Nova senha"
                    required
                >

            </div>

            <div class="input-box">

                <input
                    type="password"
                    name="confirmacao"
                    placeholder="Confirme sua nova senha"
                    required
                >

            </div>

            <button type="submit" class="btn">
                ALTERAR SENHA
            </button>

        </form>

        <a href="{{ url_for('login') }}" class="voltar">
            Voltar para o login
        </a>

    </div>

</body>
</html>
